{% if analytics_id %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ analytics_id | urlencode }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', {{ analytics_id | tojson }});
  </script>
{% endif %}
